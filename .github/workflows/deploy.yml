name: 🚀 Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Pull latest code and restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project (root of the repo)
            cd ride-atlas || (git clone https://github.com/arbtfnf/bikesNbeans.git && cd bikesNbeans/ride-atlas)
            
            # Update Code
            git pull origin main || echo "Fresh clone, skipping pull"
            
            # Setup/Update Backend (Oracle Linux / YUM)
            cd ride-atlas-server
            sudo dnf install -y nodejs git
            npm install
            sudo npm install -g pm2 ts-node
            pm2 delete nitro-api || true
            pm2 start index.ts --interpreter ts-node --name "nitro-api"
            
            # Setup/Update Frontend
            cd ..
            npm install
            npm run build
            
            # Final Firewall Punch (Oracle Linux)
            sudo firewall-cmd --permanent --add-port=3001/tcp
            sudo firewall-cmd --permanent --add-port=80/tcp
            sudo firewall-cmd --reload
            
            echo "🏁 NITRO DEPLOYMENT COMPLETE"
